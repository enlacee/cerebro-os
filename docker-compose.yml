services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: cerebro-os-app
    restart: unless-stopped
    environment:
      # ":80" = HTTP local. En producción pon tu dominio (ej. chat.anibalcopitan.com) y Caddy saca HTTPS solo.
      SERVER_NAME: ${SERVER_NAME:-:80}
      # El navegador siempre revalida widget.js: los cambios se ven al recargar.
      CADDY_SERVER_EXTRA_DIRECTIVES: header /widget.js Cache-Control "no-cache"
    ports:
      - "${APP_PORT:-8000}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - .:/app
      - ${KNOWLEDGE_PATH:-./knowledge}:/app/knowledge:ro
      - caddy_data:/data
      - caddy_config:/config

  # Tareas programadas (recordatorio de llamadas). Usa la misma imagen y código.
  scheduler:
    image: cerebro-os-app
    restart: unless-stopped
    depends_on:
      - app
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/app

volumes:
  caddy_data:
  caddy_config:
