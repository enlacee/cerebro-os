<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat</title>
  <style>
    :root { --bg: #f8f9fa; --fg: #202124; --muted: #5f6368; --accent: #1a73e8; --code: #fff; --line: #dadce0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; --code: #303134; --line: #3c4043; }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--fg);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      width: 100%; max-width: 640px; margin: 0 auto;
      padding: calc(32px + env(safe-area-inset-top)) 16px 32px;
    }
    h1 { font-size: clamp(28px, 7vw, 40px); line-height: 1.15; margin: 0 0 10px; font-weight: 700; }
    p { margin: 0; color: var(--muted); font-size: 17px; max-width: 30em; }
    /* "Saber más": el código ya ocupa su lugar pero invisible; al abrir solo aparece, nada se mueve. */
    .embed { width: 100%; margin-top: 28px; text-align: left; }
    .more { display: block; margin: 0 auto; padding: 6px 12px; border: 0; border-radius: 999px; background: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .more::after { content: ' ▾'; }
    .more[aria-expanded="true"]::after { content: ' ▴'; }
    .embed-body { visibility: hidden; opacity: 0; transition: opacity .2s; }
    .embed.open .embed-body { visibility: visible; opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .embed-body { transition: none; } }
    .embed small { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 6px; }
    .code { display: flex; align-items: center; gap: 8px; background: var(--code); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px; }
    .code code { flex: 1; min-width: 0; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }
    .code button { flex: none; min-height: 36px; padding: 6px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    /* Espacio abajo para que el botón 💬 del chat no tape el footer. */
    footer {
      text-align: center; color: var(--muted); font-size: 14px;
      padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>
  <!-- Página del visitante: el chat empieza abierto (data-open); el código para integrar va oculto tras "Saber más". -->
  <main>
    <h1 id="business">Chat</h1>
    <p id="greeting">Escríbenos en el chat 💬</p>

    <div class="embed">
      <button type="button" class="more" aria-expanded="false" aria-controls="embed-body">¿Quieres este chat en tu web? Saber más</button>
      <div class="embed-body" id="embed-body">
        <small>Pégalo en tu web, antes de <code>&lt;/body&gt;</code>:</small>
        <div class="code"><code id="snippet"></code><button type="button" id="copy">Copiar</button></div>
      </div>
    </div>
  </main>

  <footer>Hecho con Cerebro OS</footer>

  <script>
    // El código apunta a este mismo servidor (localhost en desarrollo, tu dominio en producción).
    var snippet = '<script src="' + location.origin + '/widget.js" defer><\/script>';
    document.getElementById('snippet').textContent = snippet;
    // Acordeón: muestra u oculta el código sin mover lo demás.
    document.querySelector('.more').addEventListener('click', function () {
      var open = this.getAttribute('aria-expanded') !== 'true';
      this.setAttribute('aria-expanded', open);
      document.querySelector('.embed').classList.toggle('open', open);
    });
    document.getElementById('copy').addEventListener('click', function () {
      var btn = this;
      navigator.clipboard.writeText(snippet).then(function () {
        btn.textContent = '¡Copiado!';
        setTimeout(function () { btn.textContent = 'Copiar'; }, 1500);
      });
    });
    // Nombre y saludo salen de la configuración de la instancia (laravel/.env).
    fetch('/api/widget').then(function (res) { return res.json(); }).then(function (cfg) {
      if (cfg.title) {
        document.getElementById('business').textContent = cfg.title;
        document.title = cfg.title + ' · Chat';
      }
      if (cfg.greeting) document.getElementById('greeting').textContent = cfg.greeting;
    });
  </script>
  <script src="/widget.js" data-open defer></script>
</body>
</html>
