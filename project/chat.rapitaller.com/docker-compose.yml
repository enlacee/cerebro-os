# Desarrollo local: docker compose up -d --build  →  http://localhost (chat abierto)
services:
  app:
    build:
      context: ../../common/frankenphp
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: cerebro-os:dev
    container_name: ${NAME:?Pon NAME en .env}
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      # El navegador siempre revalida widget.js: los cambios se ven al recargar.
      CADDY_SERVER_EXTRA_DIRECTIVES: header /widget.js Cache-Control "no-cache"
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./laravel:/app
      - ./knowledge:/app/knowledge:ro # vault de Obsidian de esta instancia

  # Tareas programadas: recordatorio de llamadas, backup y borrado de datos vencidos.
  scheduler:
    image: cerebro-os:dev
    container_name: ${NAME}-scheduler
    pull_policy: never # la imagen la construye app; no existe en Docker Hub
    restart: unless-stopped
    # Espera a que app termine de arrancar (composer install, migraciones) antes de usar vendor/.
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["php", "artisan", "schedule:work"]
    # No sirve web: el healthcheck de la imagen (Caddy) siempre fallaría aquí.
    healthcheck:
      disable: true
    volumes:
      - ./laravel:/app
